# =============================================================
#  ATM 画面テキスト定義ファイル
#  - この YAML を編集するだけで各画面の文言・色・サイズ・画像を変更できます（再コンパイル不要）。
#  - 1画面は要素(element)の並びです。要素は type: text または type: image。
#
#  text 要素:
#    text  : 表示文字列。1要素 = 1行として上から連結されます（空行は text: "" の要素を置く）。
#            {token} でランタイム値を差し込めます（下記トークン一覧参照）。
#            TMP のリッチタグ(<b> など)も併用可。
#            ★文字間インライン画像: images/ に PNG を置き、text に [img:ファイル名] と書くだけ。
#              例) text: "所持金 [img:coin] {cleanBalance}"  ← coin.png が文字と同じ行に並ぶ。
#              （拡張子は省略可。Sprite Asset は起動時に自動生成されます）
#    color : 文字色 #RRGGBB（任意）
#    size  : 文字サイズ％。100=標準（任意）
#    align : left / center / right（任意）
#    font  : TMP フォントアセット名（任意）。行ごとに変更可。
#            ※フォントアセットは Resources/Fonts & Materials/ 配下に置く必要があります（TMPの<font>解決要件）。
#
#  image 要素:
#    sprite        : StreamingAssets/ATM/ からの相対パス（例 images/logo.png）
#    width, height : ピクセルサイズ
#    x, y          : 画面中央を原点とした配置座標（+y=上）
#
#  トークン一覧:
#    {cleanBalance} {unwashedDebt} {gold} {silver} {bronze} {diamond}
#    {goldPrice} {silverPrice} {bronzePrice} {goldOwned} {silverOwned} {bronzeOwned}
#    {feeRatePercent} {launderFee} {launderNet} {passcodeMasked} {creditedAmount}
#    {typedTitle} {loginPrompt} {progressBar} {progressPercent}
# =============================================================

screens:

  # --- 初期(起動)画面＝ログイン画面：タイピング演出後そのままパスコード入力。{typedTitle}はコードが差し込む ---
  welcome:
    - type: text
      color: "#33FF66"
      size: 200
      text: "=== Devil's Bank ==="
    - type: text
      text: ""
    - type: text
      size: 240
      color: "#33FF66"
      text: "{typedTitle}"
    - type: text
      text: ""
    - type: text
      text: "AUTO-AUTHENTICATION..."
    - type: text
      size: 180
      color: "#33FF99"
      text: "[ {passcodeMasked} ]"
    - type: text
      text: ""


  # --- ログイン(パスコード入力)画面 ---
  passcode:
    - type: text
      color: "#33FF66"
      text: "=== SECURITY LOGIN ==="
    - type: text
      text: "PLEASE ENTER 4-DIGIT PIN CODE"
    - type: text
      text: ""
    - type: text
      text: "INPUT YOUR PASSCODE:"
    - type: text
      size: 140
      color: "#33FF99"
      text: "[ {passcodeMasked} ]"
    - type: text
      text: ""
    - type: text
      color: "#558855"
      text: "[ENTER] CONFIRM  /  [CANCEL] CLEAR"

  # (メインメニュー画面は廃止：ログイン後はコイン両替へ直行)

  # --- 残高照会 (現在は導線なし・参照用に残置) ---
  inquiry:
    - type: text
      color: "#33FF66"
      text: "=== BALANCE INQUIRY ==="
    - type: text
      text: "CLEAN BALANCE:  {cleanBalance} DC"
    - type: text
      color: "#FF5533"
      text: "UNWASHED DEBT:  {unwashedDebt} DC"
    - type: text
      text: ""
    - type: text
      text: "COINS RETRIEVED:"
    - type: text
      text: "GOLD:{gold}  SILVER:{silver}  BRONZE:{bronze}"
    - type: text
      text: "BLACK DIAMOND:{diamond}"
    - type: text
      text: ""
    - type: text
      text: "[0] BACK TO MAIN MENU"

  # --- 資金洗浄 確認画面（現状メニュー導線なし・別途接続予定） ---
  launderConfirm:
    - type: text
      color: "#33FF66"
      text: "=== LAUNDER DEBT ==="
    - type: text
      text: "DIRTY CASH: {unwashedDebt} DC"
    - type: text
      text: "LAUNDERING FEE ({feeRatePercent}%): -{launderFee} DC"
    - type: text
      color: "#33FF99"
      text: "CREDITED NET AMOUNT: {launderNet} DC"
    - type: text
      text: ""
    - type: text
      text: "EXECUTE LAUNDERING?"
    - type: text
      text: "[ENTER] CONFIRM TRANSACTION"
    - type: text
      text: "[CANCEL] EXIT TO MENU"

  # --- コイン両替（ログイン後ここに直行）。右側の縦スピンボックスはコード生成UIが重なる ---
  # 各行の {sel*Open}/{sel*Close} は選択中の行だけ緑色にするためコードが差し込む。
  # コイン画像は images/gold.png 等を置くと [img:gold] で表示される（無くても文字は出る）。
  coinExchange:
    - type: text
      color: "#33FF66"
      size: 150
      text: "=== COIN EXCHANGE ==="
    - type: text
      text: ""
    # 金/銀/銅の3行は ATMController がコードで生成する（1行ずつ位置や画像を調整できるようにするため）。
    # ここは行数を合わせて場所を空けているだけ。文言や画像は Inspector の「コイン行 (金/銀/銅) の配置」で変更する
    - type: text
      text: ""
    - type: text
      text: ""
    - type: text
      text: ""
    - type: text
      text: ""
    - type: text
      text: ""
    - type: text
      text: ""
    - type: text
      size: 50
      align: left
      color: "#558855"
      text: "[UP/DOWN] SELECT   [SPACE] SELL ALL   [CANCEL] EXIT"

  # --- 処理中（プログレスバー）。{progressBar}/{progressPercent} はコードが差し込む ---
  processing:
    - type: text
      color: "#FFCC33"
      text: "=== PROCESSING ==="
    - type: text
      text: "LAUNDERING TRANSACTION IN PROGRESS..."
    - type: text
      text: ""
    - type: text
      text: "[{progressBar}] {progressPercent}%"
    - type: text
      text: ""
    - type: text
      color: "#FF3333"
      text: "WARNING: DO NOT POWER OFF TERMINAL"

  # --- ハッキング起動画面（黒と赤のぱちぱち中に出る文字） ---
  # 1要素目 = 大見出し / 2要素目以降 = 起動メッセージ（並べた順に、演出時間を均等に割って表示）
  # 反映されるのは text / color / size のみ。size は 100 でコード側の既定サイズ
  # ぱちぱちの長さ・速さ・強さ・色は ATMHackingMode の「起動演出（黒と赤のぱちぱち）」で調整する
  hackBoot:
    - type: text
      color: "#FF2A2A"
      size: 100
      text: "HACKING MODE"
    - type: text
      color: "#BF4040"
      size: 100
      text: "BYPASSING SECURITY LAYER..."
    - type: text
      color: "#BF4040"
      size: 100
      text: "INJECTING PAYLOAD..."
    - type: text
      color: "#BF4040"
      size: 100
      text: "SCANNING INTERBANK TRAFFIC..."
    - type: text
      color: "#BF4040"
      size: 100
      text: "ROOT ACCESS GRANTED"

  # --- ハッキング失敗（ステージ1で失敗）画面 ---
  # 1要素目 = 大見出し / 2要素目 = その下の行。中央に大きく表示される
  hackDenied:
    - type: text
      color: "#FF2A2A"
      size: 100
      text: "ACCESS DENIED"
    - type: text
      color: "#BF4040"
      size: 100
      text: "CONNECTION TERMINATED BY HOST"

  # --- ハッキング成功（ミニゲームクリア）画面 ---
  # ハッキング画面はコード生成UIのため、この画面だけは特別扱い:
  #   1要素目 = 大見出し / 2要素目 = その下の行
  #   反映されるのは text / color / size のみ（align・font・画像は無視されます）
  #   size は 100 でコード側の既定サイズ。150 なら1.5倍
  # 使えるトークン: {amount} {fromBank} {toBank} {difficulty}
  hackSuccess:
    - type: text
      color: "#33FF66"
      size: 80
      text: "MISSION COMPLETE"
    - type: text
      color: "#BF4040"
      size: 110
      text: "{amount}  REROUTED FROM {fromBank}"

  # --- 取引成功 ---
  success:
    - type: text
      color: "#33FF66"
      text: "=== TRANSACTION SUCCESS ==="
    - type: text
      text: "LAUNDERING COMPLETED SUCCESSFULLY."
    - type: text
      text: ""
    - type: text
      text: "CREDITED AMOUNT: {creditedAmount} DC"
    - type: text
      text: ""
    - type: text
      text: "[ENTER] RETURN TO MENU"
